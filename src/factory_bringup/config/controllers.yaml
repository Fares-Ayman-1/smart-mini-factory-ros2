controller_manager:
  ros__parameters:
    update_rate: 200
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints: [base_yaw, shoulder, elbow, wrist_pitch, wrist_roll]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 50.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 1.0
      base_yaw: {trajectory: 0.0, goal: 0.03}
      shoulder: {trajectory: 0.0, goal: 0.03}
      elbow: {trajectory: 0.0, goal: 0.03}
      wrist_pitch: {trajectory: 0.0, goal: 0.03}
      wrist_roll: {trajectory: 0.0, goal: 0.03}

# Both fingers move together. Goal tolerance 0 (= not checked), because when
# the fingers close on a product they stop short of the commanded position.
gripper_controller:
  ros__parameters:
    joints: [finger_left_joint, finger_right_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0
      finger_left_joint: {trajectory: 0.0, goal: 0.0}
      finger_right_joint: {trajectory: 0.0, goal: 0.0}
