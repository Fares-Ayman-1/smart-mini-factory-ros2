# ros_gz_bridge configuration for the factory world.
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS
- ros_topic_name: /camera/image_raw
  gz_topic_name: /camera/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
- ros_topic_name: /camera/camera_info
  gz_topic_name: /camera/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS
- ros_topic_name: /ir1/scan
  gz_topic_name: /ir1/scan
  ros_type_name: sensor_msgs/msg/LaserScan
  gz_type_name: gz.msgs.LaserScan
  direction: GZ_TO_ROS
- ros_topic_name: /ir2/scan
  gz_topic_name: /ir2/scan
  ros_type_name: sensor_msgs/msg/LaserScan
  gz_type_name: gz.msgs.LaserScan
  direction: GZ_TO_ROS
- ros_topic_name: /conveyor/belt_cmd_vel
  gz_topic_name: /model/conveyor/link/belt/track_cmd_vel
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
- ros_topic_name: /factory/grasp/attach
  gz_topic_name: /factory/grasp/attach
  ros_type_name: std_msgs/msg/Empty
  gz_type_name: gz.msgs.Empty
  direction: ROS_TO_GZ
- ros_topic_name: /factory/grasp/detach
  gz_topic_name: /factory/grasp/detach
  ros_type_name: std_msgs/msg/Empty
  gz_type_name: gz.msgs.Empty
  direction: ROS_TO_GZ
- ros_topic_name: /factory/grasp/state
  gz_topic_name: /factory/grasp/state
  ros_type_name: std_msgs/msg/String
  gz_type_name: gz.msgs.StringMsg
  direction: GZ_TO_ROS
- service_name: /world/factory/create
  ros_type_name: ros_gz_interfaces/srv/SpawnEntity
  gz_req_type_name: gz.msgs.EntityFactory
  gz_rep_type_name: gz.msgs.Boolean
- service_name: /world/factory/remove
  ros_type_name: ros_gz_interfaces/srv/DeleteEntity
  gz_req_type_name: gz.msgs.Entity
  gz_rep_type_name: gz.msgs.Boolean
- service_name: /world/factory/set_pose
  ros_type_name: ros_gz_interfaces/srv/SetEntityPose
  gz_req_type_name: gz.msgs.Pose
  gz_rep_type_name: gz.msgs.Boolean
